# frontend/nginx.spa.conf
# Served inside the Docker image as /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_types        text/plain text/css application/json
                      application/javascript text/xml text/javascript;
    gzip_min_length   1024;

    # Static assets — Vite content-hashes filenames so 1yr cache is safe
    location ~* \.(js|css|woff2?|ico|png|svg|jpg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html — deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA fallback — React Router handles all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
