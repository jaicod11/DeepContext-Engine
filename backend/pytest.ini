[pytest]
asyncio_mode     = auto
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*
addopts          = -v --tb=short --no-header
markers          =
    unit:        fast, no external I/O
    integration: requires live Pinecone + Gemini (INTEGRATION_TESTS=1)
