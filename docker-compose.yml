version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Local development stack
#   • backend  — FastAPI RAG API (hot-reload via volume mount)
#   • frontend — React (Vite dev server)
#   • redis    — Cache + rate limiting
#   • nginx    — Reverse proxy / static file server
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in API keys
#   docker compose up --build
#   Open http://localhost
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime         # use 'builder' for a dev image with all tools
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_URL:   "redis://redis:6379/0"
      RELOAD:      "false"     # set to "true" + uncomment volume for hot-reload
      LOG_JSON:    "false"
      WORKERS:     "1"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Uncomment for hot-reload in development:
    # volumes:
    #   - ./backend/app:/app/app

  # ── React frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "http://localhost/api/v1"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
