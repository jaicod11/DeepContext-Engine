# ──────────────────────────────────────────────────────────────────────────────
# Local development stack
#   • postgres — Users, document records, chat sessions
#   • redis    — Embedding cache
#   • backend  — FastAPI RAG API (JWT auth)
#   • frontend — React (Vite dev server)
#   • nginx    — Reverse proxy / static file server
#
# Usage:
#   Create backend/.env with PINECONE_API_KEY, GEMINI_API_KEY and SECRET_KEY
#   (see README "Configuration"), then:
#   docker compose up --build
#   Open http://localhost
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # Auth landed after this file was first written. Without a real database the
  # backend falls back to a SQLite file INSIDE the container, so every account
  # is destroyed on `docker compose down`.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     deepcontext
      POSTGRES_PASSWORD: deepcontext
      POSTGRES_DB:       deepcontext
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepcontext -d deepcontext"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: app/Dockerfile
      target: runtime         # use 'builder' for a dev image with all tools
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # These override backend/.env, which is loaded above via env_file.
      # Everything else (PINECONE_API_KEY, GEMINI_API_KEY, SECRET_KEY, JWT_*)
      # is inherited from that file.
      DATABASE_URL: "postgresql+asyncpg://deepcontext:deepcontext@postgres:5432/deepcontext"
      REDIS_URL:    "redis://redis:6379/0"
      RELOAD:       "false"    # set to "true" + uncomment volume for hot-reload
      LOG_JSON:     "false"
      WORKERS:      "1"
      # requirements.txt no longer ships torch/sentence-transformers, so Stage 2
      # is off unless you also install requirements-reranker.txt in the image.
      RERANKER_ENABLED: "False"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Uncomment for hot-reload in development:
    # volumes:
    #   - ./backend/app:/app/app

  # ── React frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "http://localhost/api/v1"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
